# Local, self-contained profile: no PostgreSQL required.
# Run with: java -jar target/spring-app-1.0.0.jar --spring.profiles.active=local
spring:
  datasource:
    url: jdbc:h2:mem:qfieldcloud;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Local profile stays self-contained: in-memory cache instead of Redis,
  # and the RabbitMQ listener only auto-starts if a broker is reachable.
  cache:
    type: simple
  rabbitmq:
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:false}
  batch:
    jdbc:
      initialize-schema: always

management:
  health:
    db:
      enabled: true
    redis:
      enabled: false
    rabbit:
      enabled: false

logging:
  level:
    com.qfieldcloud: DEBUG
